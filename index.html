<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Генератор _config.yml для GitHub Pages</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; }
    input, select { width: 100%; padding: 8px; box-sizing: border-box; }
    button { background-color: #007bff; color: white; padding: 10px 15px; border: none; cursor: pointer; }
    #result { margin-top: 20px; padding: 15px; border: 1px solid #ddd; background-color: #f8f9fa; white-space: pre; }
  </style>
</head>
<body>
  <h1>Генератор _config.yml для GitHub Pages</h1>
  <div class="form-group">
    <label>Название сайта:</label>
    <input type="text" id="title" placeholder="Например: Мой проект">
  </div>
  <div class="form-group">
    <label>Описание:</label>
    <input type="text" id="description" placeholder="Коротко о сайте">
  </div>
  <div class="form-group">
    <label>URL сайта (без / в конце):</label>
    <input type="url" id="url" placeholder="https://ваш-ник.github.io/репозиторий">
  </div>
  <div class="form-group">
    <label>Тема оформления:</label>
    <select id="theme">
      <option value="jekyll-theme-minimal">Minimal</option>
      <option value="jekyll-theme-slate">Slate</option>
      <option value="jekyll-theme-cayman">Cayman</option>
      <option value="jekyll-theme-dinky">Dinky</option>
    </select>
  </div>
  <button onclick="generateYAML()">Сгенерировать код</button>
  <div id="result"></div>

  <script>
    function generateYAML() {
      const title = document.getElementById('title').value || 'Мой сайт';
      const description = document.getElementById('description').value || 'Описание сайта';
      const url = document.getElementById('url').value || 'https://ваш-ник.github.io';
      const theme = document.getElementById('theme').value;

      const yaml = `title: "${title}"
description: "${description}"
url: "${url}"
theme: ${theme}

# Основные настройки
baseurl: ""
locale: "ru_RU"

# Меню навигации
navigation:
  - name: "Главная"
    link: "/"
  - name: "О проекте"
    link: "/about/"
  - name: "Контакты"
    link: "/contact/"

# Автор
author:
  name: "Ваш ник"
  email: "ваш@email.com"
`;

      document.getElementById('result').textContent = yaml;
    }
  </script>
</body>
</html>
